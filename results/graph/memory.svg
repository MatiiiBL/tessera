<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="t d">
<title id='t'>Intermediate tensors and arena size of the benchmark models</title>
<desc id='d'>For each model, megabytes of intermediate tensors with fusion off and on, and the size of the arena that holds the fused model's intermediates.</desc>
<style>
svg{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;}
