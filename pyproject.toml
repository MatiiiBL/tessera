[project]
name = "tessera"
version = "0.1.0"
description = "A tensor compiler for Apple silicon: ONNX models to fused, autotuned kernels for the CPU (NEON, SME) and the GPU (Metal)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matías Blanco" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnx>=1.17",
    "rich>=13.0",
    "typer>=0.15",
]

[project.scripts]
tessera = "tessera.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "onnxruntime>=1.20",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]
# Heavy, optional: exporting real models and running the baselines.
bench = [
    "onnxruntime>=1.20",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "torch.*", "torchvision.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not models'"
timeout = 600
markers = [
    "slow: long-running (end-to-end models, tuning); run with -m slow",
    "models: needs exported ONNX models in data/models (scripts/export_models.py)",
    "metal: needs a Metal GPU (skipped automatically when there is none)",
    "sme: needs the Arm Scalable Matrix Extension (skipped automatically)",
]
